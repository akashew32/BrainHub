services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brainhub
      POSTGRES_USER: brainhub
      POSTGRES_PASSWORD: brainhub
    ports: ["5432:5432"]
    volumes: ["brainhub_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainhub"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://brainhub:brainhub@db:5432/brainhub
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000/api}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  brainhub_data:
